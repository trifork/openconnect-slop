# openconnect-slop configuration
# Copy to ~/.config/openconnect-slop/config.toml and fill in your values.

# Your VPN username (usually user@company.com)
username = "you@company.com"

# VPN tunnel group (connection profile) to use.
# Check your VPN portal login page for available groups.
# For Trifork vpn01 with MobilePASS: "webvpn-vpn01-safenet"
auth_group = "webvpn-vpn01-safenet"

# Auth mode: "totp" (fully automated, see security warning below),
# "totp-prompt" (enter code at runtime — no stored secret), or
# "push" (approve on phone)
auth_mode = "totp"

# TOTP secret — base32-encoded seed from your MobilePASS provisioning QR code.
# Required when auth_mode = "totp". Leave blank for push mode or totp-prompt.
# Example: scan your provisioning QR code; the secret is the "secret=" parameter
# in the otpauth://totp/...?secret=XXXXXXXXXXXX URL.
#
# ⚠️  SECURITY WARNING — storing this secret likely violates your company's
# security policy. The TOTP secret IS your second factor. Putting it in a
# config file reduces MFA to single-factor authentication: anyone who reads
# the file can generate valid codes indefinitely.
#
# Prefer auth_mode = "push" for unattended use, or
# auth_mode = "totp-prompt" to enter the code at runtime (see reveng-234.9).
totp_secret = ""

# AnyConnect client version string advertised to the server.
# Default is "4.7.00136" — change only if your server requires a specific version.
# ac_version = "4.7.00136"

